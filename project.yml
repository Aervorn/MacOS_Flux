# Projet XcodeGen : `xcodegen generate` crée Flux.xcodeproj
name: Flux
options:
  bundleIdPrefix: io.github.aervorn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    # Sparkle compare ce numéro : l'augmenter à chaque version publiée
    CURRENT_PROJECT_VERSION: "4"

targets:
  Flux:
    type: application
    platform: macOS
    sources:
      - path: Flux
        excludes:
          - "Resources/**"
      - path: Flux/Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Flux
        # Anglais par défaut (langues autres que le français) ; textes sources en français
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.news
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Beaucoup de flux et d'images sont encore servis en http://
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Mises à jour Sparkle : flux des versions et clé publique EdDSA (scripts/sparkle-keys.sh)
        SUFeedURL: https://raw.githubusercontent.com/Aervorn/MacOS_Flux/main/appcast.xml
        SUPublicEDKey: eZCHe74IeZ8DBTAY+tVftTLA2+kKJT3xD5e/QmhV2sE=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aervorn.flux
        PRODUCT_NAME: Flux
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signature locale ("Sign to Run Locally") : pas besoin de compte développeur
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
